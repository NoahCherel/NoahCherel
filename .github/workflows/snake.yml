name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:       # run it by hand from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs (Côte d'Azur palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E39B2B&color_dots=#ebedf0,#c9d6fb,#93adf6,#5b86ff,#2d5be3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F2B24C&color_dots=#161b22,#1c2a55,#24418f,#3a62d6,#5b86ff

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
